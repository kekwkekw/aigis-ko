[Probe]
EnableHooks=1
EnableTextHooks=1
LogTextEvents=0
LogALTextProp=0
LogALFontW3=0
Deduplicate=1
MaxCaptureEntries=1500
MaxLogsPerSecond=200

[R1]
EnableTranslation=1
TranslationsDb=AigisKR\data\translations.json
TemplatesDb=AigisKR\data\templates.json

[R2]
NoticeOverlayDb=AigisKR\data\notices.json

[Coverage]
EnableCoverage=0
FlushIntervalMs=15000

[Phase5]
EnableHangulFont=1
EnableExtendedGlyphFallback=1

[FontStress]
EnableFontStress=0
Cycles=2600

[Diagnostics]
CaptureBackbuffer=0
CaptureIntervalMs=10000
MaxSnapshots=60
SnapshotDir=AigisKR_snaps
EnableVirtualClick=0

[AutoTranslate]
Enabled=1
LiveTextRefresh=1
Provider=hdTrans
HdTransMode=Auto
HdTransPath=
BundledHdTransPath=AigisKR\hdtrans
HdTransHostPath=AigisKR\bin\AigisKR.HdTransHost.exe
HostTimeoutMs=15000
CacheEnabled=1
CacheFile=AigisKR\cache\hdtrans_cache.jsonl
SeedCacheFile=AigisKR\data\hdtrans_seed_cache.jsonl
OverridesFile=AigisKR\data\overrides.json
KnowledgeDir=AigisKR\data\knowledge
RetranslateStale=0
WorkerThreads=1
QueueMax=4096
TranslateUI=1
TranslateStory=1
UseSessionContext=0
MinLength=1
MaxLength=0
LogAutoTranslate=0
